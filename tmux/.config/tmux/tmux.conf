# ==============================================================================
# 1. GENERAL SETTINGS & QUALITY OF LIFE
# ==============================================================================

# TrueColor & undercurl support
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB,*:usstyle"

# Extended modifier keys
set -s extended-keys on
set -as terminal-features "xterm*:extkeys"

# System clipboard sync
set -s set-clipboard on

# Mouse support
set -g mouse on

# Reduce Escape delay for Vim/Neovim
set -sg escape-time 0

# Scrollback history & message display time
set -g history-limit 50000
set -g display-time 2000

# Pass focus events to applications
set -g focus-events on

# Switch session instead of detaching on destroy
set -g detach-on-destroy off

# Window and pane numbering
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# New windows and panes inherit the current working directory
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Stop mouse dragging from leaving copy-mode
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection -x


# ==============================================================================
# 2. KEYBINDINGS
# ==============================================================================

# Prefix: Ctrl+Space
unbind C-b
set -g prefix C-Space

# Reload configuration
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# Vi keybindings
setw -g mode-keys vi
set -g status-keys vi

# Copy mode selection
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Toggle last window
bind Space last-window
bind C-Space last-window

# Terminal display-popup
bind Enter display-popup \
  -d "#{pane_current_path}" \
  -w 75% \
  -h 75% \
  -E "${SHELL}"


# ==============================================================================
# 3. COLOR PALETTE — MONOKAI PRO (FILTER SPECTRUM)
# ==============================================================================

set -g @color_bg         "#262626"
set -g @color_bg_dark    "#222222"
set -g @color_red        "#fc618d"
set -g @color_green      "#7bd88f"
set -g @color_yellow     "#fce566"
set -g @color_cyan       "#5ad4e6"
set -g @color_purple     "#948ae3"
set -g @color_orange     "#fd9353"
set -g @color_fg_light   "#f7f1ff"
set -g @color_fg_muted   "#69676c"
set -g @color_border_dim "#363537"


# ==============================================================================
# 4. APPEARANCE & THEMING
# ==============================================================================

# --- Status bar ---
set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-style "bg=default,fg=#{@color_fg_light}"

# Left segment
set -g status-left-length 40
set -g status-left-style "bg=default,fg=#{@color_fg_light}"
set -g status-left "#{?client_prefix,#[fg=#{@color_yellow}]#[bg=#{@color_yellow}]#[fg=#{@color_bg_dark}]#[bold]#S#[bg=default]#[fg=#{@color_yellow}],#[fg=#{@color_border_dim}]#[bg=#{@color_border_dim}]#[fg=#{@color_fg_light}]#[bold]#S#[bg=default]#[fg=#{@color_border_dim}]}#[default] "
# set -g status-left "#{?client_prefix,#[bg=#{@color_yellow}]#[fg=#{@color_bg_dark}]#[bold] #S #[bg=default],#[bg=#{@color_border_dim}]#[fg=#{@color_fg_light}]#[bold] #S #[bg=default]}#[default] "

# Right segment
set -g status-right-length 100
set -g status-right-style "bg=default,fg=#{@color_fg_light}"
set -g status-right "#{?#{==:#{pane_mode},copy-mode},#[fg=#{@color_purple}]#[bg=#{@color_purple}]#[fg=#{@color_bg_dark}]#[bold]COPY#[bg=default]#[fg=#{@color_purple}] ,}#[fg=#{@color_border_dim}]#[bg=#{@color_border_dim}]#[fg=#{@color_cyan}]@#h#[bg=default]#[fg=#{@color_border_dim}] #[fg=#{@color_border_dim}]#[bg=#{@color_border_dim}]#[fg=#{@color_fg_light}]%d %b  #[bold]%H:%M#[nobold]#[bg=default]#[fg=#{@color_border_dim}]"
# set -g status-right "#{?#{==:#{pane_mode},copy-mode},#[bg=#{@color_purple}]#[fg=#{@color_bg_dark}]#[bold] COPY #[bg=default] ,}#[bg=#{@color_border_dim}]#[fg=#{@color_cyan}] @#h #[bg=default] #[bg=#{@color_border_dim}]#[fg=#{@color_fg_light}] %d %b  #[bold]%H:%M #[nobold]#[bg=default]"

# --- Window tabs ---
setw -g window-status-separator " "
setw -g window-status-style "bg=default,fg=#{@color_fg_muted}"
setw -g window-status-current-style "bg=default"

setw -g window-status-format " #I:#W#{?window_zoomed_flag, [Z],} "
setw -g window-status-current-format "#[fg=#{@color_green}]#[bg=#{@color_green}]#[fg=#{@color_bg_dark}]#[bold]#I:#W#{?window_zoomed_flag, [Z],}#[bg=default]#[fg=#{@color_green}]"
# setw -g window-status-current-format "#[bg=#{@color_green}]#[fg=#{@color_bg_dark}]#[bold] #I:#W#{?window_zoomed_flag, [Z],} #[bg=default]"

setw -g window-status-activity-style "bg=default,fg=#{@color_orange},bold"
setw -g window-status-bell-style "bg=#{@color_red},fg=#{@color_bg_dark},bold"

# --- Pane borders ---
set -g pane-border-lines single
set -g pane-border-style "fg=#{@color_border_dim}"
set -g pane-active-border-style "fg=#{@color_green}"

# Pane numbers (Prefix + q)
set -g display-panes-colour "#{@color_border_dim}"
set -g display-panes-active-colour "#{@color_yellow}"

# --- Copy mode ---
set -g mode-style "bg=#{@color_yellow},fg=#{@color_bg_dark},bold"
set -g copy-mode-selection-style "bg=#{@color_purple},fg=#{@color_bg_dark}"
set -g copy-mode-match-style "bg=#{@color_cyan},fg=#{@color_bg_dark}"
set -g copy-mode-current-match-style "bg=#{@color_orange},fg=#{@color_bg_dark},bold"
set -g copy-mode-position-style "bg=#{@color_bg_dark},fg=#{@color_fg_light}"

# --- Tree mode (Prefix + s / Prefix + w) ---
set -g tree-mode-border-style "fg=#{@color_border_dim}"
set -g tree-mode-selection-style "bg=#{@color_yellow},fg=#{@color_bg_dark},bold"
set -g tree-mode-preview-style "bg=#{@color_bg_dark},fg=#{@color_fg_light}"

# --- Popup menus ---
set -g popup-style "bg=default,fg=#{@color_fg_light}"
set -g popup-border-style "fg=#{@color_green}"
set -g popup-border-lines rounded

# --- Menus ---
set -g menu-style "bg=#{@color_bg_dark},fg=#{@color_fg_light}"
set -g menu-selected-style "bg=#{@color_yellow},fg=#{@color_bg_dark},bold"
set -g menu-border-style "fg=#{@color_green}"
set -g menu-border-lines rounded

# --- Command prompt and messages ---
set -g message-style "bg=default,fg=#{@color_yellow},fill=#{@color_bg}"
set -g message-command-style "bg=default,fg=#{@color_fg_muted},fill=#{@color_bg}"

# --- Clock (Prefix + t) ---
setw -g clock-mode-colour "#{@color_green}"

